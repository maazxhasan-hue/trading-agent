name: Continuous NSE Paper Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 9-14 * * 1-5"
      timezone: "Asia/Kolkata"
    - cron: "*/5 15 * * 1-5"
      timezone: "Asia/Kolkata"

concurrency:
  group: nse-paper-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_TRADING: "false"
      CLOUD_RUNTIME: "false"
      LIVE_RUNTIME_APPROVED: "false"
      NSE_MARKET_DATA_PROVIDER: "yahoo"
      NSE_SYMBOLS: "RELIANCE,INFY,HDFCBANK,TCS,ICICIBANK,SBIN,LT,AXISBANK,ITC,BHARTIARTL"
      NSE_INTERVAL: "5m"
      MAX_MARKETS_PER_SCAN: "100"
      NSE_RESEARCH_MARKETS_PER_CYCLE: "10"
      SCAN_INTERVAL_SECONDS: "300"
      AGENT_LEARNING_FILE: "data/nse_agent_learning.json"
      PAPER_STATE_FILE: "data/nse_paper_state.json"
      PAPER_STARTING_CAPITAL: "100000"
      PAPER_TAKE_PROFIT_MULTIPLE: "2.0"
      PAPER_MAX_HOLD_CYCLES: "12"
      PAPER_SLIPPAGE_BPS: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore paper state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: nse-paper-state-${{ github.run_id }}
          restore-keys: |
            nse-paper-state-
      - name: Run one paper scan
        run: python -c "from nse_agent import NSETradingCompany; NSETradingCompany().cycle()"
      - name: Show paper state
        if: always()
        run: |
          if [ -f data/nse_paper_state.json ]; then cat data/nse_paper_state.json; else echo "No paper state produced."; fi
      - name: Save paper state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: nse-paper-state-${{ github.run_id }}
      - name: Upload paper state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-paper-state-${{ github.run_id }}
          path: data
          if-no-files-found: warn
          retention-days: 14
