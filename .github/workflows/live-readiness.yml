name: Live Readiness Audit

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_TRADING: "false"
      MCX_MARKET_DATA_PROVIDER: "yahoo"
      CLOUD_RUNTIME: "false"
      LIVE_RUNTIME_APPROVED: "false"
      LIVE_TRADING_ARM: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run readiness audit
        run: python live_readiness.py
      - name: Run readiness test
        run: python -m pytest tests/test_live_readiness.py -q
