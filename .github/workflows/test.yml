name: Trading Agent Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile agent.py agent_runtime.py agent_supervisor.py agent_lifecycle.py calibration.py portfolio_risk.py signals.py post_trade.py execution_polymarket.py research_pipeline.py research_quality.py fair_value.py event_calendar.py agent_research_tools.py live_reconciliation.py execution_risk.py
