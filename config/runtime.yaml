mode: paper
scan_interval_seconds: 300
max_markets_per_scan: 1000
edge_min_pct: 8.0
confidence_min: 0.80
max_position_fraction: 0.06
kelly_fraction: 0.25
live_orders: false

cloud_runtime: true
restart_policy: unless-stopped
agent_browser_isolation: true
agent_terminal_isolation: true
browser_headless: true
workspace_root: agent_workspaces

research_before_trade: true
continuous_order_reconciliation: true
research_sources:
  - market_data
  - order_book
  - news
  - macro_events
  - social_x
  - crypto
  - cross_market

revenge_trading: false
averaging_down: false
