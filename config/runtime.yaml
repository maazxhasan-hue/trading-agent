mode: paper
scan_interval_seconds: 300
max_markets_per_scan: 1000
research_markets_per_cycle: 25
max_research_markets: 100
max_research_age_seconds: 900
learning_shadow_markets_per_cycle: 15
edge_min_pct: 8.0
confidence_min: 0.80
max_position_fraction: 0.06
kelly_fraction: 0.25
live_orders: false

cloud_runtime: true
restart_policy: unless-stopped
runtime_timezone: Asia/Kolkata
runtime_healthcheck_seconds: 30
state_recovery_required: true
single_engine_instance_required: true
reconcile_broker_state_on_start: true
fail_closed_on_recovery_error: true

market_session:
  venue: angelone_configured_exchange
  use_exchange_calendar_when_available: true
  use_timezone: Asia/Kolkata
  live_entry_requires_verified_open_session: true
  closed_session_policy: research_only
  unknown_session_policy: no_live_entry
  holidays_and_special_sessions_must_be_explicit: true

off_hours_research:
  enabled: true
  collect_authorized_news_and_announcements: true
  collect_macro_and_exchange_calendar: true
  collect_global_market_context: true
  collect_latest_available_history: true
  review_trade_autopsies_and_strategy_metrics: true
  build_next_session_watchlist: true
  validate_sources_and_timestamps: true
  paper_test_candidates_only: true
  auto_promote_to_live: false
  persist_research_journal: true
  mark_unavailable_sources_explicitly: true
  prohibit_fabricated_or_stale_live_quotes: true
agent_browser_isolation: true
agent_terminal_isolation: true
browser_headless: true
workspace_root: agent_workspaces

research_before_trade: true
research_freshness_gate: true
research_provenance: true
continuous_order_reconciliation: true
research_sources:
  - market_data
  - order_book
  - news
  - macro_events
  - event_calendar_optional
  - social_x_optional
  - global_markets
  - exchange_announcements
  - corporate_actions
  - cross_market

require_event_calendar: false
require_x_social: false
revenge_trading: false
averaging_down: false

execution_risk:
  max_slippage: 0.02
  min_book_depth_multiple: 2.0
  kill_switch: false

market_feed:
  endpoint: gamma_markets_keyset
  page_size: 100
  min_request_interval_seconds: 2
  request_retries: 2
  backoff_base_seconds: 2
  max_retry_wait_seconds: 60
  rate_limit_cooldown_seconds: 900
  cache_file: /data/gamma_markets_cache.json
  cache_max_age_seconds: 900
  stale_cache_is_scan_only: true

learning:
  file: /data/agent_learning.json
  horizon_seconds: 300
  min_move: 0.005
  min_samples: 30
  min_accuracy: 0.55
  max_brier: 0.25
  min_validated_agents: 3
